<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Painel | Barbearia Garcia</title>

    <style>

        /* =========================
           CONFIGURAÇÕES
        ========================= */

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        :root{
            --gold:#d4af37;
            --gold-dark:#a98920;
            --bg:#070707;
            --card:#101010;
            --card2:#151515;
            --border:#262626;
            --text:#ffffff;
            --muted:#8b8b8b;
            --green:#53dc91;
            --red:#ef6b6b;
        }

        html{
            -webkit-tap-highlight-color:transparent;
        }

        body{
            min-height:100vh;
            background:
                radial-gradient(
                    circle at top,
                    #18150c 0%,
                    #090909 35%,
                    #050505 100%
                );

            color:var(--text);
            font-family:
                Inter,
                Arial,
                sans-serif;
        }

        button,
        input{
            font-family:inherit;
        }


        /* =========================
           LOGIN
        ========================= */

        #telaLogin{
            min-height:100vh;

            display:flex;
            align-items:center;
            justify-content:center;

            padding:20px;
        }

        .login-box{
            width:100%;
            max-width:420px;

            background:
                linear-gradient(
                    145deg,
                    #141414,
                    #0c0c0c
                );

            border:1px solid #2b2b2b;
            border-radius:22px;

            padding:38px 28px;

            box-shadow:
                0 25px 70px rgba(0,0,0,.55);
        }

        .login-logo{
            width:95px;
            height:95px;

            margin:0 auto 18px;

            display:flex;
            align-items:center;
            justify-content:center;
        }

        .login-logo img{
            width:100%;
            height:100%;
            object-fit:contain;
        }

        .login-box h1{
            text-align:center;
            font-size:24px;
            margin-bottom:7px;
        }

        .login-box > p{
            text-align:center;
            color:var(--muted);
            font-size:14px;

            margin-bottom:30px;
        }

        .campo{
            margin-bottom:17px;
        }

        .campo label{
            display:block;

            margin-bottom:8px;

            color:#aaa;
            font-size:12px;
            font-weight:bold;

            text-transform:uppercase;
            letter-spacing:.6px;
        }

        .campo input{
            width:100%;
            height:53px;

            background:#171717;
            color:#fff;

            border:1px solid #303030;
            border-radius:12px;

            padding:0 15px;

            font-size:16px;
            outline:none;

            transition:.2s;
        }

        .campo input:focus{
            border-color:var(--gold);

            box-shadow:
                0 0 0 3px
                rgba(212,175,55,.08);
        }

        #btnEntrar{
            width:100%;
            height:53px;

            margin-top:5px;

            border:0;
            border-radius:12px;

            background:
                linear-gradient(
                    135deg,
                    #e0bd48,
                    #b78d17
                );

            color:#080808;

            font-size:15px;
            font-weight:800;

            cursor:pointer;

            transition:.2s;
        }

        #btnEntrar:hover{
            transform:translateY(-1px);
        }

        #btnEntrar:disabled{
            opacity:.6;
            cursor:not-allowed;
        }

        #mensagem{
            min-height:20px;

            margin-top:18px;

            text-align:center;
            font-size:14px;

            color:var(--red);
        }


        /* =========================
           PAINEL
        ========================= */

        #telaPainel{
            display:none;
            min-height:100vh;
        }


        /* =========================
           TOPO
        ========================= */

        .topo{
            position:sticky;
            top:0;
            z-index:20;

            width:100%;

            background:
                rgba(8,8,8,.94);

            backdrop-filter:blur(15px);

            border-bottom:
                1px solid rgba(255,255,255,.07);
        }

        .topo-interno{
            width:min(1100px, 100%);

            min-height:78px;

            margin:auto;

            padding:10px 20px;

            display:flex;
            align-items:center;
            justify-content:space-between;

            gap:20px;
        }

        .marca{
            display:flex;
            align-items:center;

            gap:13px;
        }

        .marca img{
            width:58px;
            height:58px;

            object-fit:contain;
        }

        .marca h1{
            font-size:17px;
            font-weight:800;
        }

        .marca span{
            display:block;

            color:#777;

            margin-top:3px;

            font-size:11px;
        }

        #btnSair{
            background:#151515;
            color:#ddd;

            border:1px solid #303030;
            border-radius:10px;

            padding:10px 17px;

            font-size:13px;
            font-weight:bold;

            cursor:pointer;

            transition:.2s;
        }

        #btnSair:hover{
            border-color:#555;
            background:#1c1c1c;
        }


        /* =========================
           CONTEÚDO
        ========================= */

        .conteudo{
            width:min(950px, 100%);

            margin:auto;

            padding:
                35px
                20px
                80px;
        }


        /* =========================
           BOAS VINDAS
        ========================= */

        .cabecalho-agenda{
            display:flex;

            align-items:flex-end;
            justify-content:space-between;

            gap:20px;

            margin-bottom:25px;
        }

        .titulo-area .mini{
            display:block;

            margin-bottom:7px;

            color:var(--gold);

            font-size:11px;
            font-weight:bold;

            letter-spacing:1.5px;

            text-transform:uppercase;
        }

        .titulo-area h2{
            font-size:30px;

            letter-spacing:-1px;

            margin-bottom:7px;
        }

        .titulo-area p{
            color:var(--muted);

            font-size:14px;
        }


        /* =========================
           ABAS
        ========================= */

        .abas{
            display:flex;

            gap:6px;

            width:max-content;

            background:#0d0d0d;

            border:1px solid #242424;
            border-radius:13px;

            padding:5px;

            margin-bottom:25px;
        }

        .aba{
            min-width:100px;

            padding:11px 17px;

            background:transparent;
            color:#777;

            border:0;
            border-radius:9px;

            font-size:13px;
            font-weight:bold;

            cursor:pointer;

            transition:.2s;
        }

        .aba:hover{
            color:#ddd;
        }

        .aba.active{
            background:
                linear-gradient(
                    135deg,
                    #d9b53d,
                    #b68b16
                );

            color:#080808;

            box-shadow:
                0 5px 18px
                rgba(212,175,55,.12);
        }


        /* =========================
           LISTA
        ========================= */

        #carregando{
            color:#777;

            padding:25px 0;

            font-size:14px;
        }

        .lista-agendamentos{
            display:grid;

            gap:13px;
        }


        /* =========================
           CARD
        ========================= */

        .agendamento-card{
            position:relative;

            overflow:hidden;

            background:
                linear-gradient(
                    135deg,
                    #121212,
                    #0d0d0d
                );

            border:
                1px solid #252525;

            border-radius:17px;

            padding:20px;

            transition:
                transform .2s,
                border-color .2s;
        }

        .agendamento-card:hover{
            transform:translateY(-2px);

            border-color:#383838;
        }

        .agendamento-card::before{
            content:"";

            position:absolute;

            left:0;
            top:0;
            bottom:0;

            width:3px;

            background:var(--gold);
        }


        /* =========================
           HORÁRIO E STATUS
        ========================= */

        .card-topo{
            display:flex;

            align-items:flex-start;
            justify-content:space-between;

            gap:20px;

            padding-bottom:17px;

            margin-bottom:17px;

            border-bottom:
                1px solid #242424;
        }

        .horario{
            color:var(--gold);

            font-size:27px;
            font-weight:900;

            letter-spacing:-1px;
        }

        .card-topo small{
            display:block;

            color:#777;

            margin-top:3px;

            font-size:12px;
        }

        .status{
            display:inline-flex;

            align-items:center;

            padding:7px 11px;

            border-radius:30px;

            font-size:10px;
            font-weight:900;

            letter-spacing:.5px;
        }

        .status-agendado{
            background:
                rgba(212,175,55,.12);

            border:
                1px solid
                rgba(212,175,55,.25);

            color:#e3bf49;
        }

        .status-concluido{
            background:
                rgba(50,190,110,.12);

            border:
                1px solid
                rgba(50,190,110,.22);

            color:#63df99;
        }


        /* =========================
           DADOS
        ========================= */

        .dados{
            display:grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap:
                20px
                25px;
        }

        .dado small{
            display:block;

            margin-bottom:5px;

            color:#666;

            font-size:9px;
            font-weight:bold;

            letter-spacing:.7px;

            text-transform:uppercase;
        }

        .dado strong{
            display:block;

            color:#eee;

            font-size:14px;
            font-weight:600;

            overflow-wrap:anywhere;
        }

        .dado:first-child{
            grid-column:
                span 2;
        }

        .dado:first-child strong{
            font-size:18px;
            font-weight:800;
        }


        /* =========================
           CANCELAR
        ========================= */

        .acoes{
            display:flex;

            justify-content:flex-end;

            margin-top:18px;

            padding-top:15px;

            border-top:
                1px solid #222;
        }

        .btn-cancelar{
            padding:9px 13px;

            background:
                rgba(225,75,75,.06);

            color:#e97777;

            border:
                1px solid
                rgba(225,75,75,.25);

            border-radius:9px;

            font-size:12px;
            font-weight:bold;

            cursor:pointer;

            transition:.2s;
        }

        .btn-cancelar:hover{
            background:
                rgba(225,75,75,.13);

            border-color:
                rgba(225,75,75,.5);
        }


        /* =========================
           VAZIO
        ========================= */

        .vazio{
            padding:55px 20px;

            text-align:center;

            background:
                rgba(255,255,255,.02);

            border:
                1px dashed #292929;

            border-radius:17px;

            color:#777;

            font-size:14px;
        }

        /* =========================
   AGENDA SEMANAL
========================= */

.dia-semana{
    margin-bottom:28px;
}

.dia-semana-titulo{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;

    margin-bottom:12px;
    padding-bottom:10px;

    border-bottom:1px solid #252525;
}

.dia-semana-titulo h3{
    font-size:17px;
    color:#fff;
}

.dia-semana-titulo span{
    font-size:12px;
    color:#777;
}

.dia-hoje .dia-semana-titulo h3{
    color:var(--gold);
}

.dia-vazio{
    padding:18px;

    background:#0d0d0d;

    border:1px dashed #292929;
    border-radius:12px;

    color:#666;
    font-size:13px;
}

.dia-fechado{
    padding:18px;

    background:#0d0d0d;

    border:1px dashed #292929;
    border-radius:12px;

    color:#777;
    font-size:13px;
}

.dia-fechado strong{
    color:#a7a7a7;
}

.agendamentos-dia{
    display:grid;
    gap:12px;
}

        /* =========================
           TABLET
        ========================= */

        @media(max-width:800px){

            .dados{
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .dado:first-child{
                grid-column:
                    span 1;
            }
        }


        /* =========================
           CELULAR
        ========================= */

        @media(max-width:600px){

            body{
                background:#070707;
            }

            .topo-interno{
                min-height:68px;

                padding:
                    8px
                    14px;
            }

            .marca{
                gap:9px;
            }

            .marca img{
                width:48px;
                height:48px;
            }

            .marca h1{
                font-size:14px;
            }

            .marca span{
                font-size:9px;
            }

            #btnSair{
                padding:
                    9px
                    13px;

                font-size:11px;
            }

            .conteudo{
                padding:
                    27px
                    14px
                    60px;
            }

            .cabecalho-agenda{
                margin-bottom:20px;
            }

            .titulo-area .mini{
                font-size:9px;
            }

            .titulo-area h2{
                font-size:26px;
            }

            .titulo-area p{
                font-size:12px;
            }

            .abas{
                width:100%;

                margin-bottom:20px;
            }

            .aba{
                flex:1;

                min-width:0;
            }

            .agendamento-card{
                padding:17px;
            }

            .horario{
                font-size:25px;
            }

            .dados{
                grid-template-columns:
                    repeat(2, minmax(0,1fr));

                gap:
                    17px
                    15px;
            }

            .dado:first-child{
                grid-column:
                    1 / -1;
            }

            .dado:first-child strong{
                font-size:17px;
            }

            .dado strong{
                font-size:13px;
            }

            .acoes{
                justify-content:stretch;
            }

            .btn-cancelar{
                width:100%;

                padding:11px;
            }
        }


        /* =========================
           CELULARES PEQUENOS
        ========================= */

        @media(max-width:360px){

            .marca span{
                display:none;
            }

            .dados{
                grid-template-columns:1fr;
            }

            .dado:first-child{
                grid-column:auto;
            }
        }
      
    /* =========================================
   RESUMO DA AGENDA
========================================= */

.resumo-agenda{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:14px;
    margin:20px 0 28px;
}

.resumo-card{
    background:linear-gradient(
        145deg,
        #0d0f0e,
        #080a09
    );

    border:1px solid rgba(201,164,91,.20);
    border-radius:14px;

    padding:20px;

    display:flex;
    flex-direction:column;
    gap:5px;

    box-shadow:0 8px 25px rgba(0,0,0,.18);
}

.resumo-card span{
    color:#c9a45b;
    font-size:11px;
    font-weight:700;
    letter-spacing:1px;
}

.resumo-card strong{
    color:#f5f3ed;
    font-size:28px;
    font-weight:800;
}

.resumo-card small{
    color:#777;
    font-size:12px;
}

@media(max-width:700px){

    .resumo-agenda{
        grid-template-columns:1fr;
        gap:10px;
    }

    .resumo-card{
        padding:16px;
    }

    .resumo-card strong{
        font-size:24px;
    }
}

    </style>
</head>


<body>


    <!-- =========================
         LOGIN
    ========================== -->

    <section id="telaLogin">

        <div class="login-box">

            <div class="login-logo">

                <img
                    src="images/logo-barbearia.png"
                    alt="Barbearia Garcia"
                >

            </div>

            <h1>
                Barbearia Garcia
            </h1>

            <p>
                Acesso administrativo
            </p>


            <div class="campo">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    autocomplete="username"
                    placeholder="Digite seu e-mail"
                >

            </div>


            <div class="campo">

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    autocomplete="current-password"
                    placeholder="Digite sua senha"
                >

            </div>


            <button id="btnEntrar">
                Entrar no painel
            </button>


            <div id="mensagem"></div>

        </div>

    </section>



    <!-- =========================
         PAINEL
    ========================== -->

    <section id="telaPainel">


        <!-- TOPO -->

        <header class="topo">

            <div class="topo-interno">

                <div class="marca">

                    <img
                        src="images/logo-barbearia.png"
                        alt="Barbearia Garcia"
                    >

                    <div>

                        <h1>
                            Barbearia Garcia
                        </h1>

                        <span>
                            Painel administrativo
                        </span>

                    </div>

                </div>


                <button id="btnSair">
                    Sair
                </button>

            </div>

        </header>



        <!-- CONTEÚDO -->

        <main class="conteudo">


            <div class="cabecalho-agenda">

                <div class="titulo-area">

                    <span class="mini">
                        Barbearia Garcia
                    </span>

                    <h2>
                        Agenda
                    </h2>

                    <p id="dataAtual">
                        Carregando...
                    </p>

                </div>

            </div>



            <!-- ABAS -->

            <div class="abas">

    <button
        class="aba active"
        id="abaSemana"
    >
        Esta semana
    </button>

    <button
        class="aba"
        id="abaProximaSemana"
    >
        Próxima semana
    </button>

    <button
        class="aba"
        id="abaHistorico"
    >
        Histórico
    </button>

</div>

<div class="resumo-agenda" id="resumoAgenda">

    <div class="resumo-card">
        <span>CLIENTES</span>
        <strong id="resumoClientes">0</strong>
        <small>agendados</small>
    </div>

    <div class="resumo-card">
        <span>CONCLUÍDOS</span>
        <strong id="resumoConcluidos">0</strong>
        <small>atendimentos</small>
    </div>

    <div class="resumo-card">
        <span>VALOR PREVISTO</span>
        <strong id="resumoValor">R$ 0,00</strong>
        <small>da agenda</small>
    </div>

</div>

            <!-- CARREGAMENTO -->

            <div id="carregando">

                Carregando agendamentos...

            </div>



            <!-- AGENDAMENTOS -->

            <div
                class="lista-agendamentos"
                id="listaAgendamentos"
            ></div>


        </main>

    </section>



    <script
        type="module"
        src="painel.js"
    ></script>

</body>

</html>
